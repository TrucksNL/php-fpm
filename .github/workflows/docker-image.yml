name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/trucksnl/php-fpm

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      php-versions: ${{ steps.matrix.outputs.php-versions }}
      alpine-versions: ${{ steps.matrix.outputs.alpine-versions }}
      latest-alpine: ${{ steps.matrix.outputs.latest-alpine }}
    steps:
      # Single source of truth for the build and merge matrices.
      # Alpine versions must stay in ascending order: the last one is tagged 'latest'.
      - name: Define matrix
        id: matrix
        run: |
          php_versions='["8.4", "8.5"]'
          alpine_versions='["3.23", "3.24"]'
          echo "php-versions=$php_versions" >> $GITHUB_OUTPUT
          echo "alpine-versions=$alpine_versions" >> $GITHUB_OUTPUT
          echo "latest-alpine=$(jq -cr '.[-1]' <<< "$alpine_versions")" >> $GITHUB_OUTPUT

  build:
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        php-version: ${{ fromJSON(needs.setup.outputs.php-versions) }}
        alpine-version: ${{ fromJSON(needs.setup.outputs.alpine-versions) }}
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
    
    - name: Git checkout
      uses: actions/checkout@v4
    
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.GHCR_REPO }}
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: ${{ matrix.platform }}
    
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          PHP_VERSION=${{ matrix.php-version }}
          ALPINE_VERSION=${{ matrix.alpine-version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        file: ./Dockerfile
        # Pull requests push nothing for build-variant to layer on, so they build the full build stage instead.
        target: ${{ github.event_name == 'pull_request' && 'build' || 'runtime' }}
        platforms: ${{ matrix.platform }}
        # Pull requests have no registry credentials, so they only verify that the image builds.
        outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.GHCR_REPO) || 'type=cacheonly' }}

    - name: Export digest
      if: github.event_name != 'pull_request'
      run: |
        mkdir -p ${{ runner.temp }}/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests/${digest#sha256:}"

    - name: Upload digest
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.php-version }}-${{ matrix.alpine-version }}-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    needs:
      - setup
      - build
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.setup.outputs.php-versions) }}
        alpine-version: ${{ fromJSON(needs.setup.outputs.alpine-versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.php-version }}-${{ matrix.alpine-version }}-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
          tags: |
            ${{ matrix.php-version }}-alpine${{ matrix.alpine-version }}
            ${{ matrix.php-version }}-alpine${{ matrix.alpine-version }}-v${{ github.run_number }}
            ${{ matrix.alpine-version == needs.setup.outputs.latest-alpine && format('{0}-alpine-latest', matrix.php-version) || '' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REPO }}:${{ matrix.php-version }}-alpine${{ matrix.alpine-version }}-v${{ github.run_number }}

  # The build variant (runtime plus git and ssh) is a thin layer on top of the published runtime image,
  # so the PHP extensions are not built or downloaded a second time.
  build-variant:
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request'
    needs:
      - setup
      - merge
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.setup.outputs.php-versions) }}
        alpine-version: ${{ fromJSON(needs.setup.outputs.alpine-versions) }}
    env:
      IMAGE_TAG: ${{ matrix.php-version }}-alpine${{ matrix.alpine-version }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
          tags: |
            ${{ env.IMAGE_TAG }}-build
            ${{ env.IMAGE_TAG }}-v${{ github.run_number }}-build
            ${{ matrix.alpine-version == needs.setup.outputs.latest-alpine && format('{0}-alpine-latest-build', matrix.php-version) || '' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          build-contexts: |
            runtime=docker-image://${{ env.GHCR_REPO }}:${{ env.IMAGE_TAG }}-v${{ github.run_number }}
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: build

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh \
            ${{ env.GHCR_REPO }}:${{ env.IMAGE_TAG }}-v${{ github.run_number }}-build \
            -c 'git --version && ssh -V && test "$(id -un)" = www-data && ssh-keygen -F ssh.bitbucket.org -f /etc/ssh/ssh_known_hosts'

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_REPO }}:${{ env.IMAGE_TAG }}-v${{ github.run_number }}-build
